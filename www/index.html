<!doctype html><html lang="es"><head><link rel="icon" href="data:,"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pasapalabra 3D</title>
<style>
@font-face{font-family:K;src:url(font/keedy.ttf)}
@font-face{font-family:N;src:url(font/nunito.ttf);font-weight:200 1000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#02040c;font-family:N,Arial,sans-serif;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui .p{pointer-events:auto}
.hidden{display:none!important}
#menu{position:fixed;inset:0;z-index:30}
#menu .mbox{display:flex;gap:3vw;align-items:center;width:100%;height:100%;padding:2vh 4vw;background:linear-gradient(90deg,#00051940,#0005191a 40%,#000519cc 58%)}
#menu .logo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;height:100%}
#menu .mlogo{width:100%;max-height:70vh;object-fit:contain;filter:drop-shadow(0 6px 18px #000);animation:tFloat 4s ease-in-out infinite}
#menu .mtag{margin-top:1vh;font:900 clamp(13px,2.4vw,22px) N,Arial;color:#ffd23a;letter-spacing:2px;text-shadow:0 0 12px rgba(255,180,0,.6),0 2px 3px #000;background:#000a2899;padding:4px 16px;border-radius:20px;border:2px solid rgba(255,210,58,.6)}
#menu .col{flex:0 0 min(46vw,440px);display:flex;flex-direction:column;gap:1.4vh;max-height:100%;overflow-y:auto;padding:6px}
#menu h2{margin:0 0 4px;font:900 clamp(16px,3vw,26px) N,Arial;color:#ffd23a;text-shadow:0 2px 4px #000}
.mbtn{display:flex;align-items:center;gap:12px;font:900 clamp(14px,2.6vw,22px) N,Arial;color:#fff;background:linear-gradient(#2f6cff,#0a2fa8);border:3px solid #8fc4ff;border-radius:40px;padding:1.2vh 18px;box-shadow:0 4px 14px #0009;text-align:left;cursor:pointer}
.mbtn small{display:block;font-weight:700;font-size:.58em;opacity:.92}
.mbtn .ic{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc61a 55%,#c98a00);border:3px solid #0b1a55;display:flex;align-items:center;justify-content:center;font-size:.85em;color:#0b1a55}
.mbtn.y{background:linear-gradient(#ffe36a,#ffb400);border-color:#fff3b0;color:#3a2200}
.mbtn.y .ic{border-color:#3a2200}
.mbtn:active{transform:scale(.97)}
#menu .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#000a2826,#000410a6 75%)}
#menu .tlogo{height:min(58vh,80vw);animation:tIn 1.1s cubic-bezier(.2,1.4,.4,1) both,tFloat 3.2s ease-in-out 1.1s infinite;filter:drop-shadow(0 0 24px rgba(57,120,255,.55)) drop-shadow(0 8px 16px #000)}
#menu .tsub{font:900 clamp(18px,4.5vh,40px) N,Arial;letter-spacing:.3em;color:#ffd23a;text-shadow:0 0 14px rgba(255,170,0,.7),0 3px 4px #000;margin-top:-1vh}
#menu .ttap{margin-top:3vh;font:900 clamp(15px,3.6vh,28px) N,Arial;color:#fff;background:#0a2fa8bf;border:2px solid #8fc4ff;border-radius:40px;padding:8px 26px;animation:tBlink 1.4s ease-in-out infinite}
@keyframes tIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes tFloat{50%{transform:translateY(-1.2vh)}}
@keyframes tBlink{50%{opacity:.55}}
.orow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#000a2899;border:1px solid rgba(143,196,255,.4);border-radius:14px;padding:6px 12px;color:#fff}
.orow label{flex:1 0 30%;font:800 clamp(13px,2.2vw,17px) N,Arial}
.orow input[type=range]{width:min(24vw,170px);accent-color:#ffd23a}
.tbtn{font:900 clamp(12px,2vw,15px) N,Arial;color:#fff;background:linear-gradient(#2f6cff,#0a2fa8);border:2px solid #8fc4ff;border-radius:20px;padding:4px 10px;line-height:1.05;text-align:center}
.tbtn.on{background:linear-gradient(#ffe36a,#ffb400);color:#3a2200;border-color:#fff3b0}
.tbtn.soon{opacity:.62}.tbtn small{display:block;font-size:.62em;font-weight:800}
.mtext{font:600 clamp(12px,1.9vw,15px)/1.4 N,Arial;color:#e8f0ff;background:#00081eb8;border-radius:14px;padding:6px 16px}
.mtext b{color:#ffd23a}
#menu .col.text{flex-basis:min(60vw,640px)}
#ver{position:fixed;left:8px;bottom:4px;color:#fff9;font:12px N,Arial;z-index:31}
#toast{position:fixed;left:50%;top:6vh;transform:translateX(-50%);z-index:60;background:#0a2fa8e6;border:2px solid #8fc4ff;color:#fff;font:900 18px N,Arial;padding:8px 22px;border-radius:30px}
#sub{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);max-width:86vw;z-index:20;color:#fff;font:800 clamp(13px,2.3vw,19px)/1.3 N,Arial;text-shadow:0 2px 3px #000,0 0 6px #000;text-align:center;background:#0006;padding:4px 14px;border-radius:10px}
#sub b{color:#ffd23a}
#ans{position:fixed;left:50%;top:2vh;transform:translateX(-50%);z-index:25;min-width:40vw;background:linear-gradient(#ffffff,#dfe8ff);color:#0b1a55;border:3px solid #2f6cff;border-radius:30px;font:900 clamp(16px,3vw,26px) N,Arial;padding:6px 22px;text-align:center;letter-spacing:1px}
#ans i{font-style:normal;color:#5a6a9a;font-size:.7em}
#acts{position:fixed;right:2vw;bottom:3vh;z-index:25;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#acts .mbtn{font-size:clamp(14px,2.4vw,20px);padding:8px 18px}
#skip{position:fixed;right:2vw;top:2vh;z-index:26;font-size:14px;padding:4px 14px}
/* v0.9.1: campo de respuesta REAL y visible (antes era un <input> de 2 px transparente): se toca directamente, el teclado sale seguro y queda siempre arriba, a salvo del teclado */
#kbf{position:fixed;left:50%;top:2vh;transform:translateX(-50%);z-index:27;display:none;align-items:center;gap:8px;margin:0}
body.askon #kbf{display:flex}
body.askon #ans{display:none!important}
body.askon #sub{bottom:auto;top:calc(2vh + 62px)}
body.askon #acts{bottom:auto;top:calc(2vh + 62px);max-height:62vh;overflow-y:auto}
body.askon #skip{display:none}
#kb{width:min(56vw,540px);height:48px;font:900 22px N,Arial,sans-serif;text-transform:uppercase;text-align:center;background:linear-gradient(#fff,#dfe8ff);color:#0b1a55;border:3px solid #2f6cff;border-radius:30px;padding:4px 16px;margin:0;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation;pointer-events:auto;-webkit-appearance:none;appearance:none}
#kb::placeholder{color:#5a6a9a;font-size:16px;font-weight:700;text-transform:none}
#kb:focus{border-color:#ffd23a;box-shadow:0 0 0 4px #ff9d0099}
#kbok{height:48px;min-width:56px;border-radius:30px;border:3px solid #fff;background:#1fa84a;color:#fff;font:900 24px N,Arial,sans-serif;padding:0 14px;touch-action:manipulation}
#modal{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:center;justify-content:center}
.mcard{max-width:min(92vw,560px);max-height:92vh;overflow:auto;background:linear-gradient(#0d2a8a,#061440);border:3px solid #8fc4ff;border-radius:20px;padding:14px 22px;color:#fff;font:700 clamp(13px,2.2vw,17px)/1.4 N,Arial;text-align:center}
.mcard h3{color:#ffd23a;margin:4px 0 8px;font-size:1.4em}
#rot{position:fixed;inset:0;z-index:99;background:#02040c;color:#fff;display:none;align-items:center;justify-content:center;font:900 22px N,Arial}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="menu"></div>
<div id="sub" class="hidden"></div>
<div id="ans" class="hidden p"></div>
<div id="acts" class="p"></div>
<button id="skip" class="mbtn hidden p">Menú ☰</button>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="ver">v0.8</div>
<div id="rot">Gira el móvil 📱↻</div>
<form id="kbf" action="javascript:void 0" autocomplete="off"><input id="kb" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="send" maxlength="60" aria-label="Escribe tu respuesta" placeholder="Escribe tu respuesta"><button id="kbok" type="submit">✔</button></form>

<script src="data.js"></script>

<script src="v05.js"></script><script src="v05lines.js"></script><script src="v05b.js"></script><script src="v06.js"></script><script src="v06b.js"></script><script src="v06data.js"></script><script src="v06c.js"></script><script src="v07.js"></script><script src="v07voz.js"></script><script src="v08.js"></script><script src="v08b.js"></script><script src="v08c.js"></script>
<script src="v09data.js"></script><script src="v09voz.js"></script><script src="v09.js"></script><script src="v09b.js"></script><script src="v09c.js"></script><script src="v09d.js"></script><script src="v09e.js"></script><script src="dvdc/data.js"></script><script src="dvdc/clasico.js"></script><script src="v10data.js"></script><script src="v10voz.js"></script><script src="v10.js"></script>
</body></html>
